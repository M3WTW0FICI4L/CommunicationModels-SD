# NGINX reverse-proxy / load-balancer for the ticket API
# Balances requests across all "api" container replicas (Docker DNS round-robin
# resolves the hostname "api" to each replica IP).

upstream ticket_api {
    # Docker Compose service name "api" resolves to all replica IPs.
    # NGINX uses round-robin by default.
    server api:8000;

    # Connection keep-alive to the upstream pool
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    # Access log minimal (high throughput)
    access_log off;
    error_log  /var/log/nginx/error.log warn;

    location / {
        proxy_pass         http://ticket_api;
        proxy_http_version 1.1;

        # Keep-alive to upstream
        proxy_set_header   Connection        "";

        # Pass client information downstream
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts tuned for benchmark workloads
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Internal status page (used for monitoring)
    location /nginx_status {
        stub_status on;
        access_log  off;
        allow       127.0.0.1;
        allow       10.0.0.0/8;
        deny        all;
    }
}
