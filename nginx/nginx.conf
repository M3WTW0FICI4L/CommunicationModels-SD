# NGINX reverse-proxy / load-balancer per al ticket API
# Funciona tant en mode single-container com amb --scale api=N de Docker Compose.
#
# Docker DNS (127.0.0.11) resol el nom "api" a TOTS els contenidors del servei.
# La directiva "resolver" + variable de l'upstream força la re-resolució quan
# s'afegeixen noves rèpliques en calent.

upstream ticket_api {
    # NOTA: quan s'usa --scale api=N, Docker DNS retorna totes les IPs.
    # NGINX reparteix les connexions en round-robin entre elles.
    server api:8000;
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    # Re-resolució DNS cada 15 s → detecta noves rèpliques afegides en calent
    resolver 127.0.0.11 valid=15s ipv6=off;
    resolver_timeout 5s;

    access_log off;
    error_log  /var/log/nginx/error.log warn;

    location / {
        proxy_pass         http://ticket_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location /nginx_status {
        stub_status on;
        access_log  off;
        # Permet accés des de qualsevol lloc (útil en laboratori)
        allow all;
    }
}
