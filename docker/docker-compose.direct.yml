services:

  redis:
    image: redis:7-alpine
    container_name: ticket-redis
    command: redis-server --save "" --loglevel warning
    security_opt:
      - apparmor:unconfined
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    security_opt:
      - apparmor:unconfined
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8000"
    deploy:
      replicas: 3
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    container_name: ticket-nginx
    security_opt:
      - apparmor:unconfined
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

networks:
  default:
    name: ticket-net
