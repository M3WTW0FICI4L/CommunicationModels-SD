[pytest]
# pytest configuration

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Coverage options (if using pytest-cov)
# --cov=src
# --cov-report=term-missing
# --cov-report=html

# Test paths
testpaths = tests

# Markers for organizing tests
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
    models: Tests for models
    config: Tests for configuration
    metrics: Tests for metrics
    storage: Tests for storage backend
    ticket_manager: Tests for ticket manager
    benchmark: Tests for benchmark utilities
