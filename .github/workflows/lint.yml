name: Lint

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black flake8

      - name: Run black (format + check)
        run: |
          black --version
          # Format files in-place so CI enforces consistent style
          black .
          # Verify no remaining reformatting needed
          black --check .

      - name: Run flake8
        run: |
          # Black uses 88-character line length; make flake8 consistent.
          # Ignore E203/W503 (black compatibility) and F401/F841 (unused import/var)
          flake8 src tests --max-line-length=88 --extend-ignore=E203,W503,F401,F841
